<head>
    <meta charset="UTF-8">

    <title>Interaktívna mapa - História chutí 2</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100vw; background-color: #e6e6e6; position: absolute; top: 0; left: 0; }
        
        .sidebar {
            position: absolute;
            top: 20px;
            right: 20px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 1000;
            width: 320px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }
        
        .sidebar select {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 4px;
            border: 1px solid #ccc;
            cursor: pointer;
        }

        .legend-area {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 13px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .legend-item { display: flex; align-items: center; }
        .legend-img { width: 12px; height: 20px; margin-right: 5px; }

        .list-container {
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 5px;
        }

        .day-group { margin-bottom: 15px; }
        .day-title {
            font-weight: bold;
            font-size: 14px;
            background: #f0f0f0;
            padding: 5px;
            border-radius: 4px;
            margin-bottom: 5px;
            text-align: center;
        }

        .loc-type {
            font-size: 11px;
            text-transform: uppercase;
            color: #777;
            margin: 8px 0 2px 5px;
            letter-spacing: 0.5px;
        }

        .loc-item {
            padding: 6px 8px;
            margin-bottom: 2px;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }
        .loc-item:hover { background: #f9f9f9; border-color: #bbb; }
        .loc-item.active { background: #fffde7; border-color: #ffd600; font-weight: bold; }
        
        .loc-item.main { border-left: 4px solid #cc0000; }
        .loc-item.alt { border-left: 4px solid #0000cc; }

        .main-label {
            background: transparent; border: none; box-shadow: none; font-weight: bold; font-size: 14px;
            color: #cc0000; text-shadow: 2px 2px 0px white, -2px -2px 0px white, 2px -2px 0px white, -2px 2px 0px white;
        }
        .alt-label {
            background: transparent; border: none; box-shadow: none; font-weight: bold; font-size: 12px;
            color: #0000cc; text-shadow: 2px 2px 0px white, -2px -2px 0px white, 2px -2px 0px white, -2px 2px 0px white;
        }

        .active-tooltip {
            background-color: #ffd600 !important;
            color: #000 !important;
            border: 2px solid #b8860b !important;
            font-weight: bold !important;
            font-size: 15px !important;
            text-shadow: none !important;
            box-shadow: 0 0 12px rgba(0,0,0,0.4) !important;
            border-radius: 6px;
            padding: 4px 8px;
            cursor: pointer;
        }
        .active-tooltip::before { display: none !important; }
        
        .list-container::-webkit-scrollbar { width: 6px; }
        .list-container::-webkit-scrollbar-thumb { background-color: #ccc; border-radius: 3px; }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: auto;
                bottom: 0;
                left: 0;
                right: 0;
                width: 100%;
                max-height: 45vh;
                border-radius: 15px 15px 0 0;
                box-sizing: border-box;
                box-shadow: 0 -4px 15px rgba(0,0,0,0.2);
                margin: 0;
                padding-bottom: env(safe-area-inset-bottom, 15px); /* Podpora pre iPhone lištu */
            }

            .leaflet-bottom {
                bottom: 45vh !important; 
            }
            
            .main-label {
                font-size: 18px;
            }
            .alt-label {
                font-size: 16px;
            }
            .active-tooltip {
                font-size: 20px !important;
                padding: 6px 12px;
            }
            
            .loc-item {
                font-size: 15px;
                padding: 10px 12px;
            }
            
            .sidebar select {
                font-size: 16px;
                padding: 12px;
            }
            
            .day-title {
                font-size: 16px;
                padding: 8px;
            }
        }
    </style>
</head>

            "14": [
                { day: "🗓️ DEŇ 1", main: {name: "Zamagurie / Prístavisko pltí na Dunajci", coords: [49.395, 20.404]}, alt: [{name: "Plte na Váhu", coords: [49.176, 18.861]}, {name: "Orava", coords: [49.261, 19.358]}, {name: "Plte na rieke Poprad", coords: [49.300, 20.700]}] },
                { day: "🗓️ DEŇ 2", main: {name: "Múzeum Červený Kláštor", coords: [49.396, 20.414]}, alt: [{name: "Skanzen Stará Ľubovňa", coords: [49.314, 20.697]}, {name: "Oravský podzámok", coords: [49.261, 19.357]}, {name: "Múzeum oravskej dediny Zuberec", coords: [49.259, 19.662]}] },
                { day: "🗓️ DEŇ 3", main: {name: "Goralský dvor", coords: [49.375, 20.457]}, alt: [{name: "Lendak", coords: [49.237, 20.352]}, {name: "Osturňa", coords: [49.333, 20.244]}, {name: "Salaš v Bachledovej doline", coords: [49.274, 20.306]}] }
            ],
            "15": [
                { day: "🗓️ DEŇ 1", main: {name: "Tržnica Miletičova", coords: [48.155, 17.138]}, alt: [{name: "Tržnica Trnavské Mýto", coords: [48.158, 17.129]}, {name: "Stará Vajnorská", coords: [48.188, 17.185]}, {name: "Tržnica Žilinská", coords: [48.156, 17.109]}] },
                { day: "🗓️ DEŇ 2", main: {name: "Areál bývalých závodov ZDA Partizánske alebo Svit", coords: [48.626, 18.374]}, alt: [{name: "Cvernovka", coords: [48.177, 17.126]}, {name: "Múzeum obuvi", coords: [48.627, 18.374]}, {name: "Makyta Púchov", coords: [49.123, 18.328]}] },
                { day: "🗓️ DEŇ 3", main: {name: "Fresh Market - Tradičné ázijské bistro", coords: [48.167, 17.152]}, alt: [{name: "Tržnica Nivy", coords: [48.147, 17.128]}, {name: "Rodinná bylinková záhrada", coords: [48.120, 17.230]}, {name: "Ázijské potraviny", coords: [48.182, 17.195]}] }
            ]
        };

        var markersGroup = L.featureGroup().addTo(map);
        var activeMarkers = {};

        function focusMarker(id) {
            document.querySelectorAll('.loc-item').forEach(el => el.classList.remove('active'));
            var listItem = document.getElementById(id);
            if(listItem) {
                listItem.classList.add('active');
                listItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            for (var key in activeMarkers) {
                var mData = activeMarkers[key];
                mData.marker.setIcon(mData.originalIcon);
                mData.marker.setZIndexOffset(mData.baseZIndex);
                
                var tooltipNode = mData.marker.getTooltip().getElement();
                if(tooltipNode) {
                    tooltipNode.classList.remove('active-tooltip');
                    tooltipNode.style.zIndex = mData.baseZIndex; 
                }
            }
            
            if (activeMarkers[id]) {
                var mData = activeMarkers[id];
                mData.marker.setIcon(highlightIcon);
                mData.marker.setZIndexOffset(9999999);
                
                var tooltipNode = mData.marker.getTooltip().getElement();
                if(tooltipNode) {
                    tooltipNode.classList.add('active-tooltip');
                    tooltipNode.style.zIndex = 9999999;
                }
            }
        }

        function loadEpisode(episodeId, updateHash = true) {
            if (!episodesData[episodeId]) episodeId = "1";
            
            document.getElementById("episode-select").value = episodeId;

            if (updateHash) {
                window.location.hash = episodeId;
            }

            markersGroup.clearLayers();
            activeMarkers = {};
            var bounds = [];
            var listHtml = "";
            var data = episodesData[episodeId];
            var itemCounter = 0;
            
            var markerObjects = [];

            data.forEach(function(dayData) {
                listHtml += `<div class="day-group">`;
                listHtml += `<div class="day-title">${dayData.day}</div>`;
                
                var mId = 'loc-' + itemCounter++;
                listHtml += `<div class="loc-type">Hlavná lokácia</div>`;
                listHtml += `<div class="loc-item main" id="${mId}" onclick="focusMarker('${mId}')">${dayData.main.name}</div>`;
                
                var markerMain = L.marker(dayData.main.coords, {icon: redIcon})
                    .bindTooltip(dayData.main.name, { permanent: true, interactive: true, direction: 'right', className: 'main-label', offset: tooltipOffset })
                    .on('click', function() { focusMarker(mId); });
                markersGroup.addLayer(markerMain);
                markerObjects.push({ id: mId, name: dayData.main.name, isMain: true, marker: markerMain, originalIcon: redIcon });
                bounds.push(dayData.main.coords);

                listHtml += `<div class="loc-type">Alternatívy</div>`;
                dayData.alt.forEach(function(altLoc) {
                    var aId = 'loc-' + itemCounter++;
                    listHtml += `<div class="loc-item alt" id="${aId}" onclick="focusMarker('${aId}')">${altLoc.name}</div>`;
                    
                    var markerAlt = L.marker(altLoc.coords, {icon: blueIcon})
                        .bindTooltip(altLoc.name, { permanent: true, interactive: true, direction: 'right', className: 'alt-label', offset: tooltipOffset })
                        .on('click', function() { focusMarker(aId); });
                    markersGroup.addLayer(markerAlt);
                    markerObjects.push({ id: aId, name: altLoc.name, isMain: false, marker: markerAlt, originalIcon: blueIcon });
                    bounds.push(altLoc.coords);
                });
                
                listHtml += `</div>`;
            });

            document.getElementById('locations-list').innerHTML = listHtml;

            var sortedMarkers = markerObjects.slice().sort(function(a, b) {
                if (a.isMain && !b.isMain) return -1;
                if (!a.isMain && b.isMain) return 1;
                return a.name.localeCompare(b.name, 'sk');
            });

            sortedMarkers.forEach(function(item, index) {
                var baseZ = (sortedMarkers.length - index) * 10000;
                if (item.isMain) baseZ += 1000000; 

                item.marker.setZIndexOffset(baseZ);
                activeMarkers[item.id] = {
                    marker: item.marker,
                    originalIcon: item.originalIcon,
                    baseZIndex: baseZ
                };

                var tooltipNode = item.marker.getTooltip().getElement();
                if(tooltipNode) {
                    tooltipNode.style.zIndex = baseZ; 
                }
            });

            if(bounds.length > 0) {
                var isMobileView = window.innerWidth <= 768;
                var bottomPadding = isMobileView ? [50, window.innerHeight * 0.45 + 30] : [380, 50];

                map.fitBounds(bounds, { 
                    paddingTopLeft: [50, 50], 
                    paddingBottomRight: bottomPadding, 
                    maxZoom: 11 
                });
            }
        }

        var initialEpisode = "1";
        var hash = window.location.hash.replace("#", "");
        if (hash && episodesData[hash]) {
            initialEpisode = hash;
        }

        loadEpisode(initialEpisode, false);

        document.getElementById("episode-select").addEventListener("change", function(e) {
            loadEpisode(e.target.value, true);
        });

        window.addEventListener('resize', function() {
            var currentEpisode = document.getElementById("episode-select").value;
            loadEpisode(currentEpisode, false);
        });

    </script>
</body>
